[project]
name = "bioqa-agent"
version = "0.1.0"
description = "面向生物信息学问题的问答 Agent：混合检索 + 工具调用 + 可复现评估"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
bioqa = "bioqa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bioqa*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
